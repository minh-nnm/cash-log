<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sổ thu tiền</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F9E6E">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ thu tiền">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --paper:#F7F5EF;
    --ink:#12321F;
    --accent:#2F9E6E;
    --accent-dim:#DCEFE3;
    --warn:#C05B2E;
    --muted:#8A9A8E;
    --line:#D8D2C4;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
    transition:background .2s ease;
  }
  body.book-luong{
    --paper:#EDF2FA;
    --accent:#2F6EA6;
    --accent-dim:#DCE7F5;
    --ink:#132840;
  }
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-variant-numeric: tabular-nums;}

  header{
    padding:28px 20px 20px;
    position:relative;
  }
  header::after{
    content:"";
    position:absolute;
    left:20px; right:20px; bottom:0;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 4px;
  }
  h1{
    margin:0;
    font-size:22px;
    font-weight:700;
  }
  .header-icon-btn{
    position:absolute;
    right:20px; top:24px;
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  .menu-row{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
    font-size:14px;
    font-weight:600;
    text-align:left;
    margin-bottom:10px;
    cursor:pointer;
  }
  .menu-row svg{flex:none; color:var(--accent);}
  .menu-row .menu-sub{
    display:block;
    font-size:12px;
    font-weight:400;
    color:var(--muted);
    margin-top:2px;
  }

  .book-tabs{
    display:flex;
    gap:4px;
    margin:20px 20px 0;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px;
  }
  .book-tab{
    flex:1;
    border:none;
    background:transparent;
    padding:10px;
    border-radius:9px;
    font-size:14px;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
  }
  .book-tab.active{
    background:var(--accent);
    color:var(--white);
  }

  .total-card{
    margin:16px 20px 0;
    background:var(--ink);
    color:var(--paper);
    border-radius:18px;
    padding:22px 20px;
    position:relative;
    overflow:hidden;
  }
  .total-card .label{
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    opacity:.65;
    margin-bottom:6px;
  }
  .total-card .amount{
    font-size:34px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .total-card .amount.neg{color:#F2A07B;}
  .total-card .sub{
    margin-top:10px;
    font-size:13px;
    opacity:.7;
    display:flex;
    justify-content:space-between;
  }

  .type-tabs{margin:0 0 16px;}
  .chip-sep{flex:none; width:1px; margin:4px 2px; background:var(--line);}

  .filter-row{
    display:flex;
    gap:8px;
    margin:16px 20px 0;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .chip{
    flex:none;
    font-size:13px;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
    cursor:pointer;
  }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--white);
    font-weight:600;
  }
  .chip.search-toggle{
    display:flex;
    align-items:center;
    gap:4px;
  }

  .range-bar{
    display:none;
    align-items:center;
    gap:8px;
    margin:10px 20px 0;
    flex-wrap:wrap;
  }
  .range-bar.open{display:flex;}
  .range-bar input[type=date]{
    flex:1;
    min-width:130px;
    padding:8px 10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--white);
    font-size:13px;
    color:var(--ink);
  }
  .range-bar .sep{color:var(--muted); font-size:13px; flex:none;}
  .range-btn{
    flex:none;
    padding:8px 14px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:var(--white);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .range-btn-ghost{
    background:var(--white);
    color:var(--ink);
    border:1px solid var(--line);
  }

  .list{
    margin:18px 20px 0;
    background:var(--white);
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .empty{
    padding:36px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px dashed var(--line);
    position:relative;
  }
  .row:last-child{border-bottom:none;}
  .row .dot{
    width:36px; height:36px; border-radius:50%;
    background:var(--accent-dim);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px;
    flex:none;
  }
  .row .info{flex:1; min-width:0;}
  .row .name{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .meta{font-size:12.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .amt{font-weight:700; font-size:15px; flex:none; text-align:right;}
  .row.out .dot{background:#F6E3D9; color:var(--warn);}
  .row.out .amt{color:var(--warn);}
  .row .del{
    flex:none;
    width:28px; height:28px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .row .del:active{background:#F0E9E4; color:var(--warn);}

  .fab{
    position:fixed;
    right:20px; bottom:20px;
    width:58px; height:58px;
    border-radius:50%;
    background:var(--accent);
    color:var(--white);
    border:none;
    font-size:28px;
    box-shadow:0 8px 20px rgba(47,158,110,.35);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:20;
  }
  .fab:active{transform:scale(.94);}

  .fab-scan{
    position:fixed;
    right:20px; bottom:90px;
    width:58px; height:58px;
    padding:0;
    border-radius:50%;
    background:var(--accent);
    color:var(--white);
    border:none;
    font-size:24px;
    line-height:1;
    box-shadow:0 8px 20px rgba(47,158,110,.35);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:20;
  }
  .fab-scan:active{transform:scale(.94);}
  .fab-scan.loading{opacity:.55; pointer-events:none;}

  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(18,50,31,.4);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:30;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--paper);
    border-radius:20px 20px 0 0;
    padding:20px 20px 28px;
    transform:translateY(100%);
    transition:transform .25s ease;
    z-index:31;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet.open{transform:translateY(0);}
  .sheet h2{margin:0 0 16px; font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--white);
    font-size:16px;
    color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:12px;
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:var(--white);}
  .btn-primary:active{background:#26825c;}
  .btn-ghost{background:var(--white); color:var(--ink); border:1px solid var(--line);}

  .toast{
    position:fixed;
    left:50%; bottom:90px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
    z-index:40;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <p class="eyebrow">Cá nhân · lưu trên máy này</p>
  <h1>Sổ thu tiền</h1>
  <button class="header-icon-btn" id="settingsBtn" aria-label="Sao lưu dữ liệu">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </button>
</header>

<div class="book-tabs" id="bookTabs">
  <button class="book-tab active" data-book="thu">Thu tiền</button>
  <button class="book-tab" data-book="luong">Lương</button>
</div>

<div class="total-card">
  <div class="label" id="totalLabel">Tổng đã nhận</div>
  <div class="amount mono" id="totalAmount">0 ₫</div>
  <div class="sub">
    <span id="inLabel"></span>
    <span id="outLabel"></span>
  </div>
  <div class="sub">
    <span id="countLabel">0 giao dịch</span>
  </div>
</div>

<div class="filter-row" id="filterRow"></div>

<div class="range-bar" id="rangeBar">
  <input type="date" id="rangeFrom" aria-label="Từ ngày">
  <span class="sep">đến</span>
  <input type="date" id="rangeTo" aria-label="Đến ngày">
  <button class="range-btn" id="rangeApply">Lọc</button>
  <button class="range-btn range-btn-ghost" id="rangeClear">Xóa</button>
</div>

<div class="list" id="list"></div>

<input type="file" id="scanInput" accept="image/*" style="display:none">
<button class="fab-scan" id="scanBtn" aria-label="Quét ảnh giao dịch">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
</button>
<button class="fab" id="addBtn" aria-label="Thêm giao dịch">+</button>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <h2 id="sheetTitle">Thêm giao dịch</h2>
  <div class="book-tabs type-tabs" id="typeTabs">
    <button class="book-tab active" data-type="in">Thu</button>
    <button class="book-tab" data-type="out">Rút</button>
  </div>
  <div class="field">
    <label for="fName">Người chuyển</label>
    <input type="text" id="fName" placeholder="VD: Nguyễn Văn A" autocomplete="off">
  </div>
  <div class="field">
    <label for="fAmount">Số tiền (VND)</label>
    <input type="number" id="fAmount" placeholder="VD: 500000" inputmode="numeric">
  </div>
  <div class="field">
    <label for="fDate">Ngày giao dịch</label>
    <input type="date" id="fDate">
  </div>
  <div class="field">
    <label for="fNote">Ghi chú (không bắt buộc)</label>
    <input type="text" id="fNote" placeholder="VD: tiền hàng, nội dung CK..." autocomplete="off">
  </div>
  <div class="sheet-actions">
    <button class="btn btn-ghost" id="cancelBtn">Hủy</button>
    <button class="btn btn-primary" id="saveBtn">Lưu</button>
  </div>
</div>

<div class="sheet-backdrop" id="settingsBackdrop"></div>
<div class="sheet" id="settingsSheet">
  <h2>Sao lưu dữ liệu</h2>
  <button class="menu-row" id="exportBtn">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    <span>
      Xuất dữ liệu ra Excel
      <span class="menu-sub">Lưu cả 2 sổ thành 1 file .csv, mở trực tiếp bằng Excel</span>
    </span>
  </button>
  <button class="menu-row" id="importBtn">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
    <span>
      Nhập dữ liệu từ Excel
      <span class="menu-sub">Khôi phục từ file .csv đã xuất trước đó</span>
    </span>
  </button>
  <input type="file" id="importInput" accept=".csv,text/csv" style="display:none">
  <button class="btn btn-ghost" id="settingsCloseBtn" style="width:100%;">Đóng</button>
</div>

<div class="sheet-backdrop" id="confirmBackdrop"></div>
<div class="sheet" id="confirmSheet">
  <h2>Xác nhận</h2>
  <p id="confirmMsg" style="color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 16px;"></p>
  <div class="sheet-actions">
    <button class="btn btn-ghost" id="confirmCancelBtn">Hủy</button>
    <button class="btn btn-primary" id="confirmOkBtn">Đồng ý</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const BOOKS = {
  thu: {
    key: 'so-thu-tien-transactions',
    totalLabel: 'Số dư',
    addTitle: 'Thêm giao dịch',
    editTitle: 'Sửa giao dịch',
    emptyText: 'Chưa có giao dịch nào. Bấm nút + để thêm.',
    nameLabel: 'Người chuyển',
    namePlaceholder: 'VD: Nguyễn Văn A',
  },
  luong: {
    key: 'so-luong-transactions',
    totalLabel: 'Số dư lương',
    addTitle: 'Thêm lương',
    editTitle: 'Sửa lương',
    emptyText: 'Chưa có khoản lương nào. Bấm nút + để thêm.',
    nameLabel: 'Nơi trả lương',
    namePlaceholder: 'VD: Công ty ABC',
  },
};
// Nhãn dùng chung cho khoản rút ở mọi sổ
const OUT_CFG = {
  addTitle: 'Thêm khoản rút',
  editTitle: 'Sửa khoản rút',
  nameLabel: 'Rút cho / Mục đích',
  namePlaceholder: 'VD: Trả tiền nhà, rút ATM',
};
const ACTIVE_BOOK_KEY = 'so-thu-tien-active-book';
let currentBook = (localStorage.getItem(ACTIVE_BOOK_KEY) in BOOKS) ? localStorage.getItem(ACTIVE_BOOK_KEY) : 'thu';
let items = [];
let editingId = null;
let activeFilter = 'all';
let dateRange = null; // { from, to } khi lọc theo khoảng ngày
let typeFilter = 'all'; // 'all' | 'in' | 'out'
let formType = 'in';    // kiểu đang chọn trong form thêm/sửa

// Giao dịch cũ không có trường type => coi là tiền vào
const isOut = i => i.type === 'out';
function sumAmount(list){ return list.reduce((s,i) => s + (i.amount || 0), 0); }
function bookBalance(excludeId){
  const list = items.filter(i => i.id !== excludeId);
  return sumAmount(list.filter(i => !isOut(i))) - sumAmount(list.filter(isOut));
}

// Lưu trực tiếp trên trình duyệt của máy (localStorage) để dùng độc lập,
// không cần mở qua Claude mỗi lần. Mỗi sổ (thu tiền / lương) có key riêng
// nên dữ liệu không lẫn vào nhau.
const storage = {
  get(){
    try{
      const raw = localStorage.getItem(BOOKS[currentBook].key);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  },
  set(data){
    try{
      localStorage.setItem(BOOKS[currentBook].key, JSON.stringify(data));
      return true;
    }catch(e){ return false; }
  }
};

function fmtVND(n){
  return new Intl.NumberFormat('vi-VN').format(n) + ' \u20AB';
}
function initials(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '?';
  return (parts[parts.length-1][0] || '?').toUpperCase();
}
function fmtDateShort(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function monthKey(iso){
  if(!iso) return 'khac';
  return iso.slice(0,7); // YYYY-MM
}
function monthLabel(key){
  if(key === 'khac') return 'Khác';
  const [y,m] = key.split('-');
  return `Th ${parseInt(m,10)}/${y}`;
}
function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

let confirmResolve = null;
function showConfirm(msg){
  return new Promise(resolve => {
    confirmResolve = resolve;
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmBackdrop').classList.add('open');
    document.getElementById('confirmSheet').classList.add('open');
  });
}
function closeConfirm(result){
  document.getElementById('confirmBackdrop').classList.remove('open');
  document.getElementById('confirmSheet').classList.remove('open');
  if(confirmResolve) confirmResolve(result);
  confirmResolve = null;
}

function openSettings(){
  document.getElementById('settingsBackdrop').classList.add('open');
  document.getElementById('settingsSheet').classList.add('open');
}
function closeSettings(){
  document.getElementById('settingsBackdrop').classList.remove('open');
  document.getElementById('settingsSheet').classList.remove('open');
}

function csvEscape(val){
  const s = String(val ?? '');
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        rows.push(row); row = [];
      } else field += c;
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0] !== '');
}

function parseDateShortToISO(s){
  const m = String(s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return '';
  const [, d, mo, y] = m;
  return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
}

function handleExport(){
  const rows = [['Loại', 'Tên/Nơi', 'Số tiền', 'Ngày giao dịch', 'Ghi chú', 'Kiểu']];
  const thu = JSON.parse(localStorage.getItem(BOOKS.thu.key) || '[]');
  const luong = JSON.parse(localStorage.getItem(BOOKS.luong.key) || '[]');
  const kieu = i => isOut(i) ? 'Rút' : 'Thu';
  thu.forEach(i => rows.push(['Thu tiền', i.name, i.amount, fmtDateShort(i.date), i.note || '', kieu(i)]));
  luong.forEach(i => rows.push(['Lương', i.name, i.amount, fmtDateShort(i.date), i.note || '', kieu(i)]));
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `so-thu-tien-${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Đã tải file Excel (.csv)');
}

async function handleImportFile(file){
  if(!file) return;
  let rows;
  try{
    let text = await file.text();
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    rows = parseCSV(text);
  }catch(err){
    showToast('Không đọc được file, kiểm tra lại nhé');
    return;
  }
  if(rows.length < 2){
    showToast('File không có dữ liệu hợp lệ');
    return;
  }
  const thu = [], luong = [];
  rows.slice(1).forEach((r, idx) => {
    const [loai, ten, soTien, ngay, ghiChu, kieu] = r;
    const amount = parseFloat(String(soTien).replace(/[^\d.-]/g, ''));
    const date = parseDateShortToISO(ngay);
    if(!ten || !amount || !date) return;
    const item = {
      id: 'tx_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).slice(2, 5),
      name: ten, amount, date, note: ghiChu || '',
      // File cũ chỉ có 5 cột => thiếu cột Kiểu thì coi là Thu
      type: (kieu || '').trim() === 'Rút' ? 'out' : 'in',
    };
    if((loai || '').trim() === 'Lương') luong.push(item);
    else thu.push(item);
  });
  if(!thu.length && !luong.length){
    showToast('Không tìm thấy dòng dữ liệu hợp lệ trong file');
    return;
  }
  const ok = await showConfirm(`Tìm thấy ${thu.length} dòng Thu tiền và ${luong.length} dòng Lương. Nhập sẽ GHI ĐÈ dữ liệu hiện tại. Tiếp tục?`);
  if(!ok) return;
  localStorage.setItem(BOOKS.thu.key, JSON.stringify(thu));
  localStorage.setItem(BOOKS.luong.key, JSON.stringify(luong));
  loadItems();
  showToast('Đã nhập dữ liệu thành công');
}

function stripDiacritics(str){
  return str.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
}

function parseTransactionText(rawText){
  const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
  const norm = lines.map(l => stripDiacritics(l).toLowerCase());

  const findValueForLabel = (labelKeywords, sameLineRegex) => {
    for(let i=0;i<lines.length;i++){
      if(labelKeywords.some(k => norm[i].includes(k))){
        let m = lines[i].match(sameLineRegex);
        if(m) return m;
        for(let j=i+1;j<Math.min(i+3,lines.length);j++){
          m = lines[j].match(sameLineRegex);
          if(m) return m;
        }
      }
    }
    return null;
  };

  let date = '';
  const dateM = findValueForLabel(['ngay giao dich','ngay gd'], /(\d{2})\/(\d{2})\/(\d{4})/)
             || rawText.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(dateM) date = `${dateM[3]}-${dateM[2]}-${dateM[1]}`;

  let amount = null;
  const amtM = findValueForLabel(['so tien','thanh toan'], /(\d{1,3}(?:[.,]\d{3})+)/)
            || rawText.match(/(\d{1,3}(?:[.,]\d{3})+)/);
  if(amtM) amount = parseInt(amtM[1].replace(/[.,]/g,''), 10);

  let note = '';
  let name = '';
  const contentIdx = norm.findIndex(l => l.includes('noi dung'));
  if(contentIdx !== -1){
    const firstLine = lines[contentIdx].replace(/^.*?d[ịi]ch\s*/i, '').trim();
    note = [firstLine, ...lines.slice(contentIdx+1)].join(' ').replace(/\s+/g,' ').trim();
  }
  const nameM = note.match(/^([A-Za-zÀ-Ỹà-ỹ\s]{4,40}?)\s+chuy[eể]n\s*(ti[eề]n|kho[aả]n)/i);
  if(nameM){
    name = nameM[1].trim().split(/\s+/).map(w => w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
  }

  // Chỉ đoán là khoản rút khi có dấu hiệu rõ: dấu trừ trước số tiền hoặc từ khóa ghi nợ/rút tiền
  const outByKeyword = norm.some(l => l.includes('ghi no') || l.includes('rut tien'));
  const outBySign = /[-−]\s*\d{1,3}(?:[.,]\d{3})+/.test(rawText);
  const type = (outByKeyword || outBySign) ? 'out' : 'in';

  return { date, amount, name, note, type };
}

async function handleScanImage(file){
  if(!file) return;
  const scanBtn = document.getElementById('scanBtn');
  scanBtn.classList.add('loading');
  showToast('Đang đọc ảnh giao dịch...');
  try{
    const { data: { text } } = await Tesseract.recognize(file, 'vie+eng');
    const parsed = parseTransactionText(text);
    openSheet(null, parsed.type);
    document.getElementById('sheetTitle').textContent = 'Xác nhận giao dịch (từ ảnh)';
    if(parsed.name) document.getElementById('fName').value = parsed.name;
    if(parsed.amount) document.getElementById('fAmount').value = parsed.amount;
    if(parsed.date) document.getElementById('fDate').value = parsed.date;
    if(parsed.note) document.getElementById('fNote').value = parsed.note;
    showToast('Đã đọc xong, kiểm tra lại rồi lưu nhé');
  }catch(err){
    showToast('Không đọc được ảnh, thử ảnh rõ hơn');
  }finally{
    scanBtn.classList.remove('loading');
  }
}

function setFormType(type){
  formType = type === 'out' ? 'out' : 'in';
  const cfg = formType === 'out' ? OUT_CFG : BOOKS[currentBook];
  document.querySelectorAll('#typeTabs .book-tab').forEach(b => b.classList.toggle('active', b.dataset.type === formType));
  document.querySelector('label[for="fName"]').textContent = cfg.nameLabel;
  document.getElementById('fName').placeholder = cfg.namePlaceholder;
  document.getElementById('sheetTitle').textContent = editingId ? cfg.editTitle : cfg.addTitle;
}

function switchBook(book){
  if(book === currentBook || !(book in BOOKS)) return;
  currentBook = book;
  localStorage.setItem(ACTIVE_BOOK_KEY, book);
  activeFilter = 'all';
  typeFilter = 'all';
  dateRange = null;
  document.getElementById('rangeFrom').value = '';
  document.getElementById('rangeTo').value = '';
  document.getElementById('rangeBar').classList.remove('open');
  document.querySelectorAll('#bookTabs .book-tab').forEach(b => b.classList.toggle('active', b.dataset.book === book));
  document.body.classList.toggle('book-luong', book === 'luong');
  loadItems();
}

async function loadItems(){
  items = storage.get();
  render();
}
async function saveItems(){
  const ok = storage.set(items);
  if(!ok) showToast('Không lưu được, thử lại nhé');
}

function openSheet(edit, type = 'in'){
  editingId = null;
  document.getElementById('fName').value = '';
  document.getElementById('fAmount').value = '';
  document.getElementById('fDate').value = todayISO();
  document.getElementById('fNote').value = '';

  if(edit){
    editingId = edit.id;
    type = edit.type;
    document.getElementById('fName').value = edit.name;
    document.getElementById('fAmount').value = edit.amount;
    document.getElementById('fDate').value = edit.date;
    document.getElementById('fNote').value = edit.note || '';
  }
  setFormType(type);
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  setTimeout(() => document.getElementById('fName').focus(), 200);
}
function closeSheet(){
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

async function handleSave(){
  const cfg = formType === 'out' ? OUT_CFG : BOOKS[currentBook];
  const type = formType;
  const name = document.getElementById('fName').value.trim();
  const amount = parseFloat(document.getElementById('fAmount').value);
  const date = document.getElementById('fDate').value || todayISO();
  const note = document.getElementById('fNote').value.trim();

  if(!name){ showToast(`Nhập ${cfg.nameLabel.toLowerCase()}`); return; }
  if(!amount || amount <= 0){ showToast('Nhập số tiền hợp lệ'); return; }
  if(type === 'out'){
    const balance = bookBalance(editingId);
    if(amount > balance){
      const ok = await showConfirm(`Số rút (${fmtVND(amount)}) lớn hơn số dư hiện tại (${fmtVND(balance)}). Vẫn lưu?`);
      if(!ok) return;
    }
  }

  if(editingId){
    const idx = items.findIndex(i => i.id === editingId);
    if(idx > -1){
      items[idx] = { ...items[idx], name, amount, date, note, type };
    }
  } else {
    items.push({
      id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      name, amount, date, note, type
    });
  }
  await saveItems();
  closeSheet();
  render();
  showToast('Đã lưu');
}

async function handleDelete(id){
  items = items.filter(i => i.id !== id);
  await saveItems();
  render();
  showToast('Đã xóa');
}

function render(){
  // filters (by month)
  const months = Array.from(new Set(items.map(i => monthKey(i.date))))
    .sort((a,b) => b.localeCompare(a));
  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = '';
  [['in', 'Thu'], ['out', 'Rút']].forEach(([t, label]) => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (typeFilter === t ? ' active' : '');
    chip.textContent = label;
    chip.onclick = () => { typeFilter = typeFilter === t ? 'all' : t; render(); };
    filterRow.appendChild(chip);
  });
  const sep = document.createElement('span');
  sep.className = 'chip-sep';
  filterRow.appendChild(sep);
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (activeFilter === 'all' ? ' active' : '');
  allChip.textContent = 'Tất cả';
  allChip.onclick = () => { activeFilter = 'all'; document.getElementById('rangeBar').classList.remove('open'); render(); };
  filterRow.appendChild(allChip);
  months.forEach(mk => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeFilter === mk ? ' active' : '');
    chip.textContent = monthLabel(mk);
    chip.onclick = () => { activeFilter = mk; document.getElementById('rangeBar').classList.remove('open'); render(); };
    filterRow.appendChild(chip);
  });
  const searchChip = document.createElement('button');
  searchChip.className = 'chip search-toggle' + (activeFilter === 'range' ? ' active' : '');
  searchChip.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span>Tìm theo ngày</span>';
  searchChip.onclick = () => document.getElementById('rangeBar').classList.toggle('open');
  filterRow.appendChild(searchChip);

  let filtered;
  if(activeFilter === 'range' && dateRange){
    filtered = items.filter(i => i.date && i.date >= dateRange.from && i.date <= dateRange.to);
  } else {
    filtered = activeFilter === 'all' ? items : items.filter(i => monthKey(i.date) === activeFilter);
  }
  const tin = sumAmount(filtered.filter(i => !isOut(i)));
  const tout = sumAmount(filtered.filter(isOut));
  if(typeFilter !== 'all') filtered = filtered.filter(i => isOut(i) === (typeFilter === 'out'));
  filtered = filtered.slice()
    .sort((a,b) => (b.date || '').localeCompare(a.date || '') || b.id.localeCompare(a.id));

  const total = typeFilter === 'in' ? tin : typeFilter === 'out' ? tout : tin - tout;
  const amountEl = document.getElementById('totalAmount');
  amountEl.textContent = fmtVND(total);
  amountEl.classList.toggle('neg', total < 0);
  document.getElementById('inLabel').textContent = `↓ Thu ${fmtVND(tin)}`;
  document.getElementById('outLabel').textContent = `↑ Rút ${fmtVND(tout)}`;
  document.getElementById('countLabel').textContent = `${filtered.length} giao dịch`;
  let totalLabelText = typeFilter === 'in' ? 'Tổng thu' : typeFilter === 'out' ? 'Tổng rút' : BOOKS[currentBook].totalLabel;
  if(activeFilter === 'range' && dateRange){
    totalLabelText += ` ${fmtDateShort(dateRange.from)} - ${fmtDateShort(dateRange.to)}`;
  } else if(activeFilter !== 'all'){
    totalLabelText += ` ${monthLabel(activeFilter)}`;
  }
  document.getElementById('totalLabel').textContent = totalLabelText;

  const list = document.getElementById('list');
  list.innerHTML = '';
  if(filtered.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = BOOKS[currentBook].emptyText;
    list.appendChild(empty);
    return;
  }
  filtered.forEach(item => {
    const row = document.createElement('div');
    const out = isOut(item);
    row.className = 'row' + (out ? ' out' : '');
    row.innerHTML = `
      <div class="dot">${out ? '↑' : initials(item.name)}</div>
      <div class="info">
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="meta">${fmtDateShort(item.date)}${item.note ? ' · ' + escapeHtml(item.note) : ''}</div>
      </div>
      <div class="amt mono">${out ? '−' : ''}${fmtVND(item.amount)}</div>
      <button class="del" aria-label="Xóa">✕</button>
    `;
    row.querySelector('.info').addEventListener('click', () => openSheet(item));
    row.querySelector('.dot').addEventListener('click', () => openSheet(item));
    row.querySelector('.amt').addEventListener('click', () => openSheet(item));
    row.querySelector('.del').addEventListener('click', (e) => {
      e.stopPropagation();
      handleDelete(item.id);
    });
    list.appendChild(row);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Đang lọc "Rút" thì mở form ở chế độ rút luôn
document.getElementById('addBtn').addEventListener('click', () => openSheet(null, typeFilter === 'out' ? 'out' : 'in'));
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
document.getElementById('backdrop').addEventListener('click', closeSheet);
document.getElementById('saveBtn').addEventListener('click', handleSave);
document.getElementById('scanBtn').addEventListener('click', () => document.getElementById('scanInput').click());
document.getElementById('scanInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  handleScanImage(file);
  e.target.value = '';
});
document.querySelectorAll('#bookTabs .book-tab').forEach(btn => {
  btn.addEventListener('click', () => switchBook(btn.dataset.book));
});
document.querySelectorAll('#typeTabs .book-tab').forEach(btn => {
  btn.addEventListener('click', () => setFormType(btn.dataset.type));
});
document.getElementById('rangeApply').addEventListener('click', () => {
  const from = document.getElementById('rangeFrom').value;
  const to = document.getElementById('rangeTo').value;
  if(!from || !to){ showToast('Chọn đủ ngày bắt đầu và kết thúc'); return; }
  if(from > to){ showToast('Ngày bắt đầu phải trước ngày kết thúc'); return; }
  dateRange = { from, to };
  activeFilter = 'range';
  render();
  document.getElementById('rangeBar').classList.add('open');
});
document.getElementById('rangeClear').addEventListener('click', () => {
  dateRange = null;
  document.getElementById('rangeFrom').value = '';
  document.getElementById('rangeTo').value = '';
  activeFilter = 'all';
  document.getElementById('rangeBar').classList.remove('open');
  render();
});
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsCloseBtn').addEventListener('click', closeSettings);
document.getElementById('settingsBackdrop').addEventListener('click', closeSettings);
document.getElementById('exportBtn').addEventListener('click', () => { handleExport(); closeSettings(); });
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importInput').click());
document.getElementById('importInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  closeSettings();
  await handleImportFile(file);
});
document.getElementById('confirmCancelBtn').addEventListener('click', () => closeConfirm(false));
document.getElementById('confirmOkBtn').addEventListener('click', () => closeConfirm(true));
document.getElementById('confirmBackdrop').addEventListener('click', () => closeConfirm(false));

document.querySelectorAll('#bookTabs .book-tab').forEach(b => b.classList.toggle('active', b.dataset.book === currentBook));
document.body.classList.toggle('book-luong', currentBook === 'luong');
setFormType('in');
loadItems();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
