<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Sổ thu tiền</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F9E6E">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ thu tiền">
<meta name="mobile-web-app-capable" content="yes">
<script>
// Áp giao diện sáng/tối ngay khi tải trang để không bị nháy màu
(function(){
  var pref = 'auto';
  try{ pref = localStorage.getItem('so-thu-tien-theme') || 'auto'; }catch(e){}
  var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<style>
  :root{
    color-scheme:light;
    --paper:#F6F5F0;
    --surface:#FFFFFF;
    --ink:#12321F;
    --muted:#77877D;
    --line:#E3DED2;
    --accent:#2F9E6E;
    --accent-dim:#E1F1E7;
    --on-accent:#FFFFFF;
    --hero:#12321F;
    --on-hero:#F6F5F0;
    --pos:#1E7B50;
    --warn:#B9531F;
    --warn-dim:#F8E6DC;
    --shadow:0 1px 2px rgba(18,40,30,.04), 0 6px 18px rgba(18,40,30,.05);
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  body.book-luong{
    --paper:#F2F5FA;
    --ink:#132840;
    --muted:#738196;
    --line:#DCE2EC;
    --accent:#2F6EA6;
    --accent-dim:#E0EAF6;
    --hero:#132840;
    --on-hero:#F2F5FA;
  }
  body.book-tong{
    --paper:#F5F3F8;
    --ink:#231A33;
    --muted:#80778F;
    --line:#E2DCEA;
    --accent:#6B4FA0;
    --accent-dim:#ECE6F6;
    --hero:#231A33;
    --on-hero:#F5F3F8;
  }
  /* Chế độ tối: data-theme được gán bởi script trong <head> (theo máy hoặc theo lựa chọn trong Quản lý sổ) */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#0E1411;
    --surface:#17201B;
    --ink:#E6EFE9;
    --muted:#8C9C92;
    --line:#26312B;
    --accent:#43C28A;
    --accent-dim:#1B3428;
    --on-accent:#06120C;
    --hero:#163527;
    --on-hero:#E8F5EE;
    --pos:#55CC93;
    --warn:#F2915F;
    --warn-dim:#3A2318;
    --shadow:none;
  }
  :root[data-theme="dark"] body.book-luong{
    --paper:#0D121A;
    --surface:#161F2C;
    --ink:#E3EAF5;
    --muted:#8A97AA;
    --line:#243044;
    --accent:#64A4EA;
    --accent-dim:#1A2C44;
    --on-accent:#07111E;
    --hero:#162C48;
    --on-hero:#E6EEF9;
  }
  :root[data-theme="dark"] body.book-tong{
    --paper:#120F18;
    --surface:#1D1826;
    --ink:#ECE6F5;
    --muted:#988FA8;
    --line:#30283D;
    --accent:#A88BE3;
    --accent-dim:#2C2342;
    --on-accent:#120A1F;
    --hero:#2A2042;
    --on-hero:#F0EAFA;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:calc(120px + var(--safe-bottom));
    transition:background .2s ease;
  }
  button{font-family:inherit;}
  .app{max-width:560px; margin:0 auto;}
  /* Tab Tổng và kỳ đã quyết toán chỉ để xem, thêm giao dịch ở kỳ hiện tại của từng sổ */
  body.book-tong .fab, body.book-tong .fab-scan,
  body.past-period .fab, body.past-period .fab-scan{display:none;}

  /* Số tiền: font thường, chữ số đều nhau để thẳng cột */
  .num{font-variant-numeric:tabular-nums; letter-spacing:-.01em; white-space:nowrap;}
  .cur{font-size:.7em; font-weight:600; margin-left:.2em; opacity:.7;}

  header{
    padding:calc(20px + var(--safe-top)) 20px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .eyebrow{
    font-size:12px;
    font-weight:500;
    color:var(--muted);
    margin:0 0 2px;
  }
  h1{
    margin:0;
    font-size:24px;
    font-weight:700;
    letter-spacing:-.02em;
  }
  .header-icon-btn{
    flex:none;
    width:40px; height:40px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  /* Nút chuyển dạng phân đoạn: tab sổ, lọc loại, loại trong form */
  .book-tabs{
    display:flex;
    gap:4px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:4px;
  }
  .book-tab{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 8px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .book-tab.active{
    background:var(--accent);
    color:var(--on-accent);
  }
  #bookTabs{margin:18px 20px 0;}
  .seg-sm{border-radius:12px; padding:3px;}
  .seg-sm .book-tab{padding:7px 8px; font-size:13px; border-radius:9px;}
  .seg-sm .book-tab.active{background:var(--accent-dim); color:var(--ink);}
  .type-tabs{margin:0 0 16px;}

  /* Nút chọn kỳ trong thẻ số dư + bảng chọn kỳ */
  .total-head{display:flex; flex-direction:column; align-items:flex-start; gap:8px; min-width:0;}
  .period-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    max-width:100%;
    padding:6px 10px 6px 12px;
    border:none;
    border-radius:999px;
    background:rgba(255,255,255,.14);
    color:var(--on-hero);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .period-pill span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .period-pill svg{flex:none; opacity:.8;}
  .period-pill:active{background:rgba(255,255,255,.22);}

  .past-banner{
    display:none;
    align-items:center;
    gap:10px;
    margin:12px 20px 0;
    padding:10px 12px;
    border-radius:14px;
    background:var(--accent-dim);
    color:var(--ink);
    font-size:13px;
  }
  .past-banner.open{display:flex;}
  .past-banner svg{flex:none; color:var(--accent);}
  .past-banner .text{flex:1; min-width:0;}
  .past-banner button{
    flex:none;
    border:none;
    background:transparent;
    color:var(--accent);
    font-size:13px;
    font-weight:700;
    padding:4px 0;
    cursor:pointer;
  }

  .period-list{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
  .period-item{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:14px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    text-align:left;
    cursor:pointer;
  }
  .period-item.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .period-ic{
    flex:none;
    width:38px; height:38px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-dim);
    color:var(--accent);
  }
  .period-item.closed .period-ic{background:var(--paper); color:var(--muted);}
  .period-body{flex:1; min-width:0;}
  .period-title{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700;}
  .period-sub{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .period-sum{font-size:13px; font-weight:600; margin-top:3px;}
  .badge{
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
    background:var(--accent);
    color:var(--on-accent);
  }
  .period-check{flex:none; color:var(--accent); visibility:hidden;}
  .period-item.selected .period-check{visibility:visible;}

  .total-card{
    margin:14px 20px 0;
    background:var(--hero);
    color:var(--on-hero);
    border-radius:22px;
    padding:20px;
    position:relative;
    overflow:hidden;
  }
  .total-card::after{
    content:"";
    position:absolute;
    right:-70px; top:-70px;
    width:200px; height:200px;
    border-radius:50%;
    background:var(--accent);
    opacity:.22;
    pointer-events:none;
  }
  .total-card > *{position:relative; z-index:1;}
  .total-top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .period-pill + .label{margin-top:2px;}
  .total-card.has-period .count-pill{margin-top:5px;}
  .total-card .label{font-size:13px; font-weight:500; opacity:.75;}
  .count-pill{
    flex:none;
    font-size:12px;
    padding:3px 10px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
  }
  .total-card .amount{
    margin-top:6px;
    font-size:36px;
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.15;
  }
  .total-card .amount.neg{color:#F6A882;}
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  .stat{background:rgba(255,255,255,.08); border-radius:14px; padding:10px 12px; min-width:0;}
  .stat-k{display:flex; align-items:center; gap:6px; font-size:12px; opacity:.8;}
  .stat-ic{
    width:18px; height:18px;
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
  }
  .stat-ic.in{background:rgba(127,224,174,.18); color:#8FE6B8;}
  .stat-ic.out{background:rgba(246,168,130,.18); color:#F6A882;}
  .stat-v{margin-top:4px; font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis;}
  .breakdown{margin-top:10px; font-size:12px; opacity:.7;}

  .filters{margin:18px 20px 0;}
  .chip-row{
    display:flex;
    gap:8px;
    margin-top:10px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:500;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
  }
  .chip.active{
    background:var(--accent-dim);
    border-color:var(--accent);
    font-weight:600;
  }

  .range-bar{
    display:none;
    align-items:center;
    gap:8px;
    margin:10px 20px 0;
    flex-wrap:wrap;
  }
  .range-bar.open{display:flex;}
  .range-bar input[type=date]{
    flex:1;
    min-width:130px;
    padding:9px 10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:14px;
    color:var(--ink);
  }
  .range-bar .sep{color:var(--muted); font-size:13px; flex:none;}
  .range-btn{
    flex:none;
    padding:9px 14px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:var(--on-accent);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .range-btn-ghost{
    background:var(--surface);
    color:var(--ink);
    border:1px solid var(--line);
  }

  /* Danh sách nhóm theo ngày */
  .list{margin:4px 20px 0;}
  .group-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    padding:18px 4px 8px;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
  }
  .group-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    position:relative;
    cursor:pointer;
  }
  .row + .row::before{
    content:"";
    position:absolute;
    left:64px; right:0; top:0;
    height:1px;
    background:var(--line);
  }
  .row:active{background:var(--accent-dim);}
  .avatar{
    width:38px; height:38px;
    border-radius:12px;
    background:var(--accent-dim);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px;
    flex:none;
  }
  .row.out .avatar{background:var(--warn-dim); color:var(--warn);}
  .info{flex:1; min-width:0;}
  .name{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .meta{font-size:12.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .amt{font-weight:700; font-size:15px; flex:none; text-align:right; color:var(--pos);}
  .row.out .amt{color:var(--warn);}

  .empty{
    margin-top:16px;
    padding:36px 24px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:16px;
  }
  .empty-icon{
    width:52px; height:52px;
    margin:0 auto 12px;
    border-radius:16px;
    background:var(--accent-dim);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }

  .fab-wrap{
    position:fixed;
    right:max(20px, calc(50% - 260px));
    bottom:calc(20px + var(--safe-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    z-index:20;
  }
  .fab, .fab-scan{
    border:none;
    padding:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .1s ease;
  }
  .fab{
    width:58px; height:58px;
    border-radius:18px;
    background:var(--accent);
    color:var(--on-accent);
    box-shadow:0 10px 24px rgba(0,0,0,.18);
  }
  .fab-scan{
    width:48px; height:48px;
    border-radius:15px;
    background:var(--surface);
    color:var(--accent);
    border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(0,0,0,.10);
  }
  .fab:active, .fab-scan:active{transform:scale(.94);}
  .fab-scan.loading{opacity:.55; pointer-events:none;}

  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(8,15,12,.45);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:30;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    margin:0 auto;
    max-width:560px;
    background:var(--paper);
    border-radius:24px 24px 0 0;
    padding:10px 20px calc(24px + var(--safe-bottom));
    transform:translateY(100%);
    transition:transform .25s ease;
    z-index:31;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet::before{
    content:"";
    display:block;
    width:40px; height:4px;
    border-radius:2px;
    background:var(--line);
    margin:0 auto 14px;
  }
  .sheet.open{transform:translateY(0);}
  .sheet h2{margin:0 0 16px; font-size:18px; letter-spacing:-.01em;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:500;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:16px;
    color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .money-input{position:relative;}
  .money-input input{padding-right:40px; font-weight:600; font-variant-numeric:tabular-nums;}
  .money-input .suffix{
    position:absolute;
    right:14px; top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    font-weight:600;
    pointer-events:none;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:12px;
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:var(--on-accent);}
  .btn-primary:active{filter:brightness(.92);}
  .btn-ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line);}
  .btn-danger-text{
    display:block;
    width:100%;
    margin-top:12px;
    padding:12px;
    border:none;
    background:transparent;
    color:var(--warn);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }

  .menu-row{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    font-size:14px;
    font-weight:600;
    text-align:left;
    margin-bottom:10px;
    cursor:pointer;
  }
  .menu-row svg{flex:none; color:var(--accent);}
  .menu-row .menu-sub{
    display:block;
    font-size:12px;
    font-weight:400;
    color:var(--muted);
    margin-top:2px;
  }
  .theme-box{
    padding:14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--surface);
    margin-bottom:10px;
  }
  .theme-head{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    font-weight:600;
    margin-bottom:12px;
  }
  .theme-head svg{flex:none; color:var(--accent);}
  .theme-box .book-tabs{background:var(--paper);}

  .sheet-text{color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 16px;}
  .settle-summary{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:4px 14px;
    margin-bottom:16px;
  }
  .settle-summary .line{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:10px 0;
    font-size:14px;
    border-bottom:1px solid var(--line);
  }
  .settle-summary .line:last-child{border-bottom:none; font-weight:700;}
  .settle-summary .line span:first-child{color:var(--muted);}

  .toast{
    position:fixed;
    left:50%;
    bottom:calc(96px + var(--safe-bottom));
    transform:translateX(-50%) translateY(20px);
    max-width:calc(100% - 40px);
    background:var(--ink);
    color:var(--paper);
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
    z-index:40;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="app">
<header>
  <div>
    <p class="eyebrow">Cá nhân · lưu trên máy này</p>
    <h1>Sổ thu tiền</h1>
  </div>
  <button class="header-icon-btn" id="settingsBtn" aria-label="Quản lý sổ">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const BOOKS = {
  thu: {
    title: 'Thu tiền',
    key: 'so-thu-tien-transactions',
    totalLabel: 'Số dư',
    addTitle: 'Thêm giao dịch',
    editTitle: 'Sửa giao dịch',
    emptyText: 'Chưa có giao dịch nào. Bấm nút + để thêm.',
    nameLabel: 'Người chuyển',
    namePlaceholder: 'VD: Nguyễn Văn A',
  },
  luong: {
    title: 'Lương',
    key: 'so-luong-transactions',
    totalLabel: 'Số dư lương',
    addTitle: 'Thêm lương',
    editTitle: 'Sửa lương',
    emptyText: 'Chưa có khoản lương nào. Bấm nút + để thêm.',
    nameLabel: 'Nơi trả lương',
    namePlaceholder: 'VD: Công ty ABC',
  },
};
// Nhãn dùng chung cho khoản rút ở mọi sổ
const OUT_CFG = {
  addTitle: 'Thêm khoản rút',
  editTitle: 'Sửa khoản rút',
  nameLabel: 'Rút cho / Mục đích',
  namePlaceholder: 'VD: Trả tiền nhà, rút ATM',
};
// Tab "Tổng": gộp cả 2 sổ để xem số dư còn lại, không lưu dữ liệu riêng
const SUMMARY = 'tong';
const SUMMARY_CFG = {
  totalLabel: 'Còn lại',
  emptyText: 'Chưa có giao dịch nào ở cả 2 sổ.',
};
const isSummary = () => currentBook === SUMMARY;
const viewCfg = () => isSummary() ? SUMMARY_CFG : BOOKS[currentBook];
const ACTIVE_BOOK_KEY = 'so-thu-tien-active-book';
const savedBook = localStorage.getItem(ACTIVE_BOOK_KEY);
let currentBook = (savedBook in BOOKS || savedBook === SUMMARY) ? savedBook : 'thu';
let items = [];
let editingId = null;
let activeFilter = 'all';
let dateRange = null; // { from, to } khi lọc theo khoảng ngày
let typeFilter = 'all'; // 'all' | 'in' | 'out'
let formType = 'in';    // kiểu đang chọn trong form thêm/sửa

// Quyết toán: dùng chung cho cả 2 sổ. Mỗi lần quyết toán gắn mã lần đó (trường settlement)
// vào mọi giao dịch chưa quyết toán, nên giao dịch thêm sau đó luôn vào kỳ mới dù trùng ngày.
// Kỳ thứ k (0-based) = settlements[k]; kỳ hiện tại = settlements.length (giao dịch chưa có settlement).
const SETTLEMENTS_KEY = 'so-thu-tien-settlements';
let settlements = loadSettlements(); // [{ id, date, from, to }]
let viewPeriod = settlements.length;
function loadSettlements(){
  try{
    const data = JSON.parse(localStorage.getItem(SETTLEMENTS_KEY) || '[]');
    return Array.isArray(data) ? data.filter(s => s && s.id) : [];
  }catch(e){ return []; }
}
function saveSettlements(){
  try{
    localStorage.setItem(SETTLEMENTS_KEY, JSON.stringify(settlements));
    return true;
  }catch(e){ return false; }
}
function periodOf(item){
  const k = item.settlement ? settlements.findIndex(s => s.id === item.settlement) : -1;
  return k === -1 ? settlements.length : k;
}
const isPastPeriod = () => viewPeriod < settlements.length;
const periodItems = () => items.filter(i => periodOf(i) === viewPeriod);
function readBook(book){
  try{ return JSON.parse(localStorage.getItem(BOOKS[book].key) || '[]'); }catch(e){ return []; }
}

// Giao dịch cũ không có trường type => coi là tiền vào
const isOut = i => i.type === 'out';
function sumAmount(list){ return list.reduce((s,i) => s + (i.amount || 0), 0); }
// Số dư chỉ tính trong 1 kỳ, vì mỗi kỳ đã quyết toán hết
function bookBalance(excludeId, period){
  const list = items.filter(i => i.id !== excludeId && periodOf(i) === period);
  return sumAmount(list.filter(i => !isOut(i))) - sumAmount(list.filter(isOut));
}

// Lưu trực tiếp trên trình duyệt của máy (localStorage) để dùng độc lập,
// không cần mở qua Claude mỗi lần. Mỗi sổ (thu tiền / lương) có key riêng
// nên dữ liệu không lẫn vào nhau.
const storage = {
  get(){
    if(isSummary()){
      // _book chỉ dùng để hiển thị trong tab Tổng, không bao giờ được lưu lại
      return Object.entries(BOOKS).flatMap(([book, cfg]) => {
        try{
          return JSON.parse(localStorage.getItem(cfg.key) || '[]').map(i => ({ ...i, _book: book }));
        }catch(e){ return []; }
      });
    }
    try{
      const raw = localStorage.getItem(BOOKS[currentBook].key);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  },
  set(data){
    try{
      localStorage.setItem(BOOKS[currentBook].key, JSON.stringify(data));
      return true;
    }catch(e){ return false; }
  }
};

function fmtVND(n){
  return new Intl.NumberFormat('vi-VN').format(n) + ' \u20AB';
}
// B\u1EA3n HTML c\u1EE7a s\u1ED1 ti\u1EC1n: k\u00FD hi\u1EC7u \u20AB nh\u1ECF h\u01A1n s\u1ED1 cho d\u1EC5 \u0111\u1ECDc
function moneyHTML(n, sign = ''){
  return `${sign}${new Intl.NumberFormat('vi-VN').format(n)}<span class="cur">\u20AB</span>`;
}
function initials(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '?';
  return (parts[parts.length-1][0] || '?').toUpperCase();
}
function fmtDateShort(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function periodLabel(k){
  if(k === settlements.length) return 'Kỳ hiện tại';
  const s = settlements[k];
  return `Kỳ ${k+1} · ${fmtDateShort(s.from).slice(0,5)} – ${fmtDateShort(s.to)}`;
}
function monthKey(iso){
  if(!iso) return 'khac';
  return iso.slice(0,7); // YYYY-MM
}
function monthLabel(key){
  if(key === 'khac') return 'Khác';
  const [y,m] = key.split('-');
  return `Th ${parseInt(m,10)}/${y}`;
}
function todayISO(daysAgo = 0){
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
const WEEKDAYS = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
function dayLabel(iso){
  if(!iso) return 'Không rõ ngày';
  if(iso === todayISO()) return 'Hôm nay';
  if(iso === todayISO(1)) return 'Hôm qua';
  const [y,m,d] = iso.split('-').map(Number);
  return `${WEEKDAYS[new Date(y, m-1, d).getDay()]}, ${fmtDateShort(iso)}`;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

let confirmResolve = null;
function showConfirm(msg, okLabel = 'Đồng ý'){
  return new Promise(resolve => {
    confirmResolve = resolve;
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmOkBtn').textContent = okLabel;
    document.getElementById('confirmBackdrop').classList.add('open');
    document.getElementById('confirmSheet').classList.add('open');
  });
}
function closeConfirm(result){
  document.getElementById('confirmBackdrop').classList.remove('open');
  document.getElementById('confirmSheet').classList.remove('open');
  if(confirmResolve) confirmResolve(result);
  confirmResolve = null;
}

function openSettings(){
  document.getElementById('settingsBackdrop').classList.add('open');
  document.getElementById('settingsSheet').classList.add('open');
}
function closeSettings(){
  document.getElementById('settingsBackdrop').classList.remove('open');
  document.getElementById('settingsSheet').classList.remove('open');
}

function csvEscape(val){
  const s = String(val ?? '');
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        rows.push(row); row = [];
      } else field += c;
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0] !== '');
}

function parseDateShortToISO(s){
  const m = String(s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return '';
  const [, d, mo, y] = m;
  return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
}

function handleExport(){
  const rows = [['Loại', 'Tên/Nơi', 'Số tiền', 'Ngày giao dịch', 'Ghi chú', 'Kiểu', 'Kỳ quyết toán']];
  const thu = readBook('thu');
  const luong = readBook('luong');
  const kieu = i => isOut(i) ? 'Rút' : 'Thu';
  // Cột Kỳ quyết toán: số thứ tự kỳ đã quyết toán, để trống nếu chưa quyết toán
  const ky = i => { const k = periodOf(i); return k < settlements.length ? k + 1 : ''; };
  thu.forEach(i => rows.push(['Thu tiền', i.name, i.amount, fmtDateShort(i.date), i.note || '', kieu(i), ky(i)]));
  luong.forEach(i => rows.push(['Lương', i.name, i.amount, fmtDateShort(i.date), i.note || '', kieu(i), ky(i)]));
  // Dòng quyết toán không có số tiền nên bản app cũ nhập file này sẽ tự bỏ qua
  settlements.forEach((s, k) => rows.push(['Quyết toán', `Kỳ ${k+1}`, '', fmtDateShort(s.date), `Từ ${fmtDateShort(s.from)} đến ${fmtDateShort(s.to)}`, '', k + 1]));
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `so-thu-tien-${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Đã tải file Excel (.csv)');
}

async function handleImportFile(file){
  if(!file) return;
  let rows;
  try{
    let text = await file.text();
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    rows = parseCSV(text);
  }catch(err){
    showToast('Không đọc được file, kiểm tra lại nhé');
    return;
  }
  if(rows.length < 2){
    showToast('File không có dữ liệu hợp lệ');
    return;
  }
  const thu = [], luong = [], settleRows = {}; // settleRows: số kỳ => dòng Quyết toán
  rows.slice(1).forEach((r, idx) => {
    const [loai, ten, soTien, ngay, ghiChu, kieu, kyStr] = r;
    const amount = parseFloat(String(soTien).replace(/[^\d.-]/g, ''));
    const date = parseDateShortToISO(ngay);
    const ky = parseInt(kyStr, 10);
    if((loai || '').trim() === 'Quyết toán'){
      const range = String(ghiChu || '').match(/(\d{1,2}\/\d{1,2}\/\d{4}).*?(\d{1,2}\/\d{1,2}\/\d{4})/);
      if(ky > 0) settleRows[ky] = {
        id: 'st_' + Date.now() + '_' + ky,
        date,
        from: range ? parseDateShortToISO(range[1]) : '',
        to: range ? parseDateShortToISO(range[2]) : date,
      };
      return;
    }
    if(!ten || !amount || !date) return;
    const item = {
      id: 'tx_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).slice(2, 5),
      name: ten, amount, date, note: ghiChu || '',
      // File cũ chỉ có 5 cột => thiếu cột Kiểu thì coi là Thu
      type: (kieu || '').trim() === 'Rút' ? 'out' : 'in',
    };
    if(ky > 0) item._ky = ky;
    if((loai || '').trim() === 'Lương') luong.push(item);
    else thu.push(item);
  });
  if(!thu.length && !luong.length){
    showToast('Không tìm thấy dòng dữ liệu hợp lệ trong file');
    return;
  }
  const kys = Object.keys(settleRows).map(Number).sort((a,b) => a - b);
  const importedSettlements = kys.map(k => settleRows[k]);
  // Gắn lại mã quyết toán theo số kỳ; giao dịch ghi kỳ không có dòng Quyết toán thì coi là chưa quyết toán
  [...thu, ...luong].forEach(i => {
    if(settleRows[i._ky]) i.settlement = settleRows[i._ky].id;
    delete i._ky;
  });
  const settleText = importedSettlements.length ? ` và ${importedSettlements.length} lần quyết toán` : '';
  const ok = await showConfirm(`Tìm thấy ${thu.length} dòng Thu tiền, ${luong.length} dòng Lương${settleText}. Nhập sẽ GHI ĐÈ dữ liệu hiện tại. Tiếp tục?`);
  if(!ok) return;
  localStorage.setItem(BOOKS.thu.key, JSON.stringify(thu));
  localStorage.setItem(BOOKS.luong.key, JSON.stringify(luong));
  settlements = importedSettlements;
  saveSettlements();
  setViewPeriod(settlements.length);
  showToast('Đã nhập dữ liệu thành công');
}

function stripDiacritics(str){
  return str.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
}

// ---- Đọc ảnh giao dịch (OCR) ----
// Nhãn thường gặp trên biên lai/thông báo ngân hàng (đã bỏ dấu, chữ thường)
const OCR_LABELS = {
  amount: ['so tien giao dich', 'so tien', 'gia tri giao dich', 'gia tri', 'tong tien', 'thanh tien', 'amount', 'gd'],
  // Con số đi kèm các nhãn này không phải số tiền giao dịch
  decoy: ['so du', 'sd', 'phi', 'ma giao dich', 'ma gd', 'ma tham chieu', 'so tham chieu', 'so tai khoan', 'tai khoan', 'tk', 'stk', 'han muc', 'kha dung', 'ref', 'trace', 'vat'],
  date: ['ngay giao dich', 'thoi gian giao dich', 'ngay gd', 'ngay', 'thoi gian', 'time', 'date'],
  nameIn: ['ten nguoi chuyen', 'nguoi chuyen', 'nguoi gui', 'ten tai khoan nguon', 'tu tai khoan', 'tu'],
  nameOut: ['ten nguoi nhan', 'nguoi nhan', 'ten tai khoan nhan', 'den tai khoan', 'den'],
  note: ['noi dung giao dich', 'noi dung chuyen khoan', 'noi dung', 'loi nhan', 'dien giai', 'mo ta', 'ghi chu', 'nd'],
  other: ['ngan hang', 'trang thai', 'loai giao dich', 'loai', 'tai', 'kenh', 'chia se', 'luu anh', 'dong'],
};
const allLabels = () => Object.values(OCR_LABELS).flat();
// Dòng (đã bỏ dấu) bắt đầu bằng nhãn nào trong danh sách? Trả về nhãn dài nhất khớp
function labelAt(normLine, keys){
  return keys.filter(k => normLine === k || new RegExp(`^${k}(\\s|:|-|$)`).test(normLine))
    .sort((a,b) => b.length - a.length)[0] || null;
}
// Bỏ các từ của nhãn ở đầu dòng gốc (giữ dấu), lấy phần giá trị phía sau
function valueAfterLabel(line, label){
  const words = line.split(' ');
  return words.slice(label.split(' ').length).join(' ').replace(/^[\s:.\-–]+/, '').trim();
}
const DATE_RE = /(?<![\d.,])(\d{1,2})\s?([\/\-.])\s?(\d{1,2})\s?\2\s?(\d{4}|\d{2})(?![\d.,])/g;
const TIME_RE = /(?<!\d)\d{1,2}:\d{2}(?::\d{2})?(?!\d)/g;
function findDates(s){
  const out = [];
  // Bỏ giờ (14:30) trước để "14:30 - 05/10/2026" không bị đọc thành ngày 30/05
  for(const m of s.replace(TIME_RE, ' ').matchAll(DATE_RE)){
    const d = +m[1], mo = +m[3];
    let y = +m[4];
    if(m[4].length === 2) y += 2000;
    if(d >= 1 && d <= 31 && mo >= 1 && mo <= 12 && y >= 2000 && y <= 2099){
      out.push(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    }
  }
  return out;
}
// Sửa lỗi OCR hay gặp trong cụm số: O -> 0, l/I -> 1 (chỉ trong cụm trông như số tiền)
function fixDigits(s){
  return s.replace(/[+\-−]?[\dOoIl|]+(?:[.,\s][\dOoIl]{3})+|[\dOo]{4,}/g, t => {
    const digits = (t.match(/\d/g) || []).length;
    return digits >= 3 ? t.replace(/[Oo]/g, '0').replace(/[Il|]/g, '1') : t;
  });
}
const AMOUNT_RE = /(?<![\d.,])([+\-−]?)\s?(\d{1,3}(?:[.,]\d{3})+|\d{1,3}(?:\s\d{3})+(?=\s?(?:vn[dđ]|đ|₫|d\b))|\d{4,})(?![\d])\s?(vn[dđ]|đ|₫|d(?![a-z]))?/gi;

function parseTransactionText(rawText){
  // Tách thêm theo dấu | để đọc được tin nhắn biến động số dư viết trên 1 dòng
  const lines = rawText.split(/\n|\|/).map(l => fixDigits(l.replace(/\s+/g, ' ').trim())).filter(Boolean);
  const norm = lines.map(l => stripDiacritics(l).toLowerCase());
  const hasDigit = i => /\d/.test(lines[i] || '');
  // Dòng i có nhãn thuộc nhóm keys không: nhãn ở đầu dòng, hoặc là cả dòng ngay trên
  // (bố cục nhãn trên, giá trị dưới). Chỉ xét đầu dòng để tiêu đề như "Tiền vào tài khoản" không bị coi là nhãn.
  const ctxHas = (i, keys) => !!labelAt(norm[i], keys) || (i > 0 && !hasDigit(i - 1) && !!labelAt(norm[i - 1], keys));

  // --- Số tiền: chấm điểm mọi con số, lấy số điểm cao nhất ---
  let best = null;
  lines.forEach((line, i) => {
    const clean = line.replace(DATE_RE, ' ').replace(TIME_RE, ' ');
    for(const m of clean.matchAll(AMOUNT_RE)){
      const value = parseInt(m[2].replace(/\D/g, ''), 10);
      if(!value || value < 1000) continue;
      if(ctxHas(i, OCR_LABELS.decoy) && !labelAt(norm[i], OCR_LABELS.amount)) continue;
      const grouped = /[.,\s]/.test(m[2]);
      // Số dài không có dấu phân cách mà cũng không có đơn vị: thường là số tài khoản/mã
      if(!grouped && !m[3]) continue;
      let score = 0;
      if(ctxHas(i, OCR_LABELS.amount)) score += 4;
      if(m[3]) score += 3;
      if(m[1]) score += 3;
      if(grouped) score += 1;
      score -= i * 0.01; // hòa điểm thì ưu tiên số ở phía trên
      if(!best || score > best.score) best = { value, sign: m[1], score };
    }
  });
  const amount = best ? best.value : null;

  // --- Ngày: ưu tiên dòng có nhãn ngày/thời gian, không thì lấy ngày hợp lệ đầu tiên ---
  let date = '';
  for(let i = 0; i < lines.length && !date; i++){
    if(ctxHas(i, OCR_LABELS.date)) date = findDates(lines[i])[0] || '';
  }
  if(!date) date = findDates(lines.join(' '))[0] || '';

  // --- Loại: dấu của số tiền là chắc nhất, sau đó mới đến từ khóa ---
  const text = norm.join(' ');
  let type = 'in';
  if(best && /[-−]/.test(best.sign)) type = 'out';
  else if(!(best && best.sign === '+')){
    const outKw = ['ghi no', 'rut tien', 'da chuyen', 'thanh toan', 'nguoi nhan'];
    const inKw = ['ghi co', 'nhan tien', 'tien vao', 'nguoi chuyen', 'nguoi gui'];
    if(outKw.some(k => text.includes(k)) && !inKw.some(k => text.includes(k))) type = 'out';
  }

  // Giá trị của 1 nhãn: phần sau nhãn trên cùng dòng, hoặc dòng kế tiếp nếu nhãn đứng riêng
  const valueOf = (keys, multiLine) => {
    for(let i = 0; i < lines.length; i++){
      const label = labelAt(norm[i], keys);
      if(!label) continue;
      let parts = [valueAfterLabel(lines[i], label)].filter(Boolean);
      // Nội dung dài có thể xuống dòng: nối thêm tối đa 1 dòng nếu dòng đó không phải nhãn khác
      const extra = parts.length ? (multiLine ? 1 : 0) : 1 + (multiLine ? 1 : 0);
      for(let j = i + 1; j <= i + extra && j < lines.length; j++){
        if(labelAt(norm[j], allLabels()) || (multiLine && /\d{1,3}(?:[.,]\d{3})+/.test(lines[j]))) break;
        parts.push(lines[j]);
      }
      const v = parts.join(' ').trim();
      if(v) return v;
    }
    return '';
  };
  const titleCase = s => s.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  const asName = s => {
    const v = s.replace(/[^A-Za-zÀ-ỹ\s]/g, ' ').replace(/\s+/g, ' ').trim();
    const words = v.split(' ');
    return words.length >= 2 && words.length <= 6 ? titleCase(v) : '';
  };

  let note = valueOf(OCR_LABELS.note, true).replace(/\s+/g, ' ').trim();
  if(!note){
    // Ảnh mờ làm mất nhãn "Nội dung": lấy dòng có "chuyen tien/khoan", bỏ ký tự rác 1-2 chữ ở đầu
    const i = norm.findIndex(l => /chuyen (tien|khoan)/.test(l));
    if(i !== -1) note = lines[i].replace(/^(\S{1,2}\s+)+/, '').trim();
  }
  let name = asName(valueOf(type === 'out' ? OCR_LABELS.nameOut : OCR_LABELS.nameIn, false));
  if(!name){
    // Không có nhãn tên: thử "NGUYEN VAN A chuyen tien ..." ở đầu nội dung
    const m = stripDiacritics(note).match(/^([A-Za-z\s]{4,40}?)\s+chuyen\s*(tien|khoan)/i);
    if(m) name = asName(note.split(' ').slice(0, m[1].trim().split(/\s+/).length).join(' '));
  }

  return { date, amount, name, note, type };
}

// Chuẩn bị ảnh cho OCR: phóng to ảnh nhỏ, đưa về chữ tối trên nền sáng, tăng tương phản
async function prepareImage(file){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(3, Math.max(1, 1600 / bmp.width));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bmp, 0, 0, w, h);
  bmp.close && bmp.close();
  const img = ctx.getImageData(0, 0, w, h), px = img.data;
  let sum = 0;
  for(let i = 0; i < px.length; i += 4) sum += (px[i] * 3 + px[i+1] * 6 + px[i+2]) / 10;
  const dark = sum / (px.length / 4) < 110;
  // Nền sáng: lấy kênh màu tối nhất để chữ màu (xanh, hồng...) thành đậm.
  // Nền tối: lấy kênh sáng nhất rồi đảo ngược để thành chữ tối trên nền sáng.
  const hist = new Uint32Array(256);
  for(let i = 0; i < px.length; i += 4){
    const v = dark ? 255 - Math.max(px[i], px[i+1], px[i+2]) : Math.min(px[i], px[i+1], px[i+2]);
    px[i] = v; hist[v]++;
  }
  // Kéo giãn tương phản theo phân vị 1% - 99%
  const n = px.length / 4;
  let lo = 0, hi = 255, acc = 0;
  for(let v = 0; v < 256; v++){ acc += hist[v]; if(acc >= n * 0.01){ lo = v; break; } }
  acc = 0;
  for(let v = 255; v >= 0; v--){ acc += hist[v]; if(acc >= n * 0.01){ hi = v; break; } }
  const range = Math.max(1, hi - lo);
  for(let i = 0; i < px.length; i += 4){
    const v = Math.max(0, Math.min(255, Math.round((px[i] - lo) * 255 / range)));
    px[i] = px[i+1] = px[i+2] = v; px[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

// Dùng chung 1 worker OCR: lần quét sau không phải nạp lại bộ chữ tiếng Việt
let ocrWorker = null;
function getOcrWorker(){
  if(!ocrWorker){
    ocrWorker = Tesseract.createWorker('vie+eng').catch(err => { ocrWorker = null; throw err; });
  }
  return ocrWorker;
}

async function handleScanImage(file){
  if(!file) return;
  if(typeof Tesseract === 'undefined'){ showToast('Cần có mạng để dùng tính năng quét ảnh'); return; }
  const scanBtn = document.getElementById('scanBtn');
  scanBtn.classList.add('loading');
  showToast('Đang đọc ảnh giao dịch...');
  try{
    const image = await prepareImage(file).catch(() => file);
    const worker = await getOcrWorker();
    const { data: { text } } = await worker.recognize(image);
    let parsed = parseTransactionText(text);
    if(!parsed.amount){
      // Lần 2 ở chế độ chữ rời rạc: bắt được con số đứng riêng mà lần đầu có thể bỏ sót
      await worker.setParameters({ tessedit_pageseg_mode: '11' });
      try{
        const retry = parseTransactionText((await worker.recognize(image)).data.text);
        if(retry.amount){
          parsed = {
            amount: retry.amount,
            type: retry.type,
            date: parsed.date || retry.date,
            name: parsed.name || retry.name,
            note: parsed.note || retry.note,
          };
        }
      }finally{
        await worker.setParameters({ tessedit_pageseg_mode: '3' });
      }
    }
    openSheet(null, parsed.type);
    document.getElementById('sheetTitle').textContent = 'Xác nhận giao dịch (từ ảnh)';
    if(parsed.name) document.getElementById('fName').value = parsed.name;
    if(parsed.amount) setAmountInput(parsed.amount);
    if(parsed.date) document.getElementById('fDate').value = parsed.date;
    if(parsed.note) document.getElementById('fNote').value = parsed.note;
    showToast(parsed.amount ? 'Đã đọc xong, kiểm tra lại rồi lưu nhé' : 'Không thấy số tiền trong ảnh, nhập tay giúp nhé');
  }catch(err){
    showToast('Không đọc được ảnh, thử ảnh rõ hơn');
  }finally{
    scanBtn.classList.remove('loading');
  }
}

function setFormType(type){
  formType = type === 'out' ? 'out' : 'in';
  const cfg = formType === 'out' ? OUT_CFG : (BOOKS[currentBook] || BOOKS.thu);
  document.querySelectorAll('#typeTabs .book-tab').forEach(b => b.classList.toggle('active', b.dataset.type === formType));
  document.querySelector('label[for="fName"]').textContent = cfg.nameLabel;
  document.getElementById('fName').placeholder = cfg.namePlaceholder;
  document.getElementById('sheetTitle').textContent = editingId ? cfg.editTitle : cfg.addTitle;
}

function resetFilters(){
  activeFilter = 'all';
  typeFilter = 'all';
  dateRange = null;
  document.getElementById('rangeFrom').value = '';
  document.getElementById('rangeTo').value = '';
  document.getElementById('rangeBar').classList.remove('open');
}

function setViewPeriod(k){
  viewPeriod = Math.min(Math.max(k, 0), settlements.length);
  resetFilters();
  // Chưa quyết toán lần nào thì không cần hiện nút chọn kỳ
  document.getElementById('periodBtn').style.display = settlements.length ? '' : 'none';
  document.querySelector('.total-card').classList.toggle('has-period', settlements.length > 0);
  document.getElementById('periodBtnLabel').textContent = periodLabel(viewPeriod);
  document.body.classList.toggle('past-period', isPastPeriod());
  document.getElementById('pastBanner').classList.toggle('open', isPastPeriod());
  document.getElementById('pastBannerText').textContent = isPastPeriod() ? `Đang xem Kỳ ${viewPeriod + 1} · đã quyết toán` : '';
  const last = settlements[settlements.length - 1];
  document.getElementById('unsettleBtn').style.display = last ? '' : 'none';
  document.getElementById('unsettleSub').textContent = last ? `Gộp kỳ hiện tại vào Kỳ ${settlements.length} (${fmtDateShort(last.from)} – ${fmtDateShort(last.to)})` : '';
  loadItems();
}

const balanceOf = list => sumAmount(list.filter(i => !isOut(i))) - sumAmount(list.filter(isOut));
// Giao dịch chưa quyết toán của cả 2 sổ, đọc thẳng từ localStorage để không phụ thuộc tab đang mở
function unsettledItems(){
  const current = settlements.length;
  return {
    thu: readBook('thu').filter(i => periodOf(i) === current),
    luong: readBook('luong').filter(i => periodOf(i) === current),
  };
}
// Từ ngày giao dịch sớm nhất đến hôm nay (hoặc ngày giao dịch muộn nhất nếu ghi trước ngày)
function settleRange(list){
  const dates = list.map(i => i.date).filter(Boolean).sort();
  const today = todayISO();
  const last = dates[dates.length - 1] || today;
  return { from: dates[0] || today, to: last > today ? last : today };
}

const ICON_PERIOD_OPEN = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>';
const ICON_PERIOD_CLOSED = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

// Bảng chọn kỳ: mỗi kỳ hiện khoảng ngày, số giao dịch và số tiền (gộp cả 2 sổ)
function openPeriodSheet(){
  const all = [...readBook('thu'), ...readBook('luong')];
  const list = document.getElementById('periodList');
  list.innerHTML = '';
  for(let k = settlements.length; k >= 0; k--){
    const inPeriod = all.filter(i => periodOf(i) === k);
    const current = k === settlements.length;
    const btn = document.createElement('button');
    btn.className = 'period-item' + (current ? '' : ' closed') + (k === viewPeriod ? ' selected' : '');
    let title, sub, sum;
    if(current){
      const dates = inPeriod.map(i => i.date).filter(Boolean).sort();
      title = 'Kỳ hiện tại <span class="badge">Đang mở</span>';
      sub = inPeriod.length ? `Từ ${fmtDateShort(dates[0])} · ${inPeriod.length} giao dịch` : 'Chưa có giao dịch';
      sum = `Số dư ${moneyHTML(balanceOf(inPeriod))}`;
    } else {
      const s = settlements[k];
      title = `Kỳ ${k + 1}`;
      sub = `${fmtDateShort(s.from)} – ${fmtDateShort(s.to)} · ${inPeriod.length} giao dịch`;
      sum = `Đã quyết toán ${moneyHTML(balanceOf(inPeriod))}`;
    }
    btn.innerHTML = `
      <span class="period-ic">${current ? ICON_PERIOD_OPEN : ICON_PERIOD_CLOSED}</span>
      <span class="period-body">
        <span class="period-title">${title}</span>
        <span class="period-sub" style="display:block">${sub}</span>
        <span class="period-sum num" style="display:block">${sum}</span>
      </span>
      <span class="period-check">${ICON_CHECK}</span>`;
    btn.onclick = () => { closePeriodSheet(); setViewPeriod(k); };
    list.appendChild(btn);
  }
  document.getElementById('periodBackdrop').classList.add('open');
  document.getElementById('periodSheet').classList.add('open');
}
function closePeriodSheet(){
  document.getElementById('periodBackdrop').classList.remove('open');
  document.getElementById('periodSheet').classList.remove('open');
}

function openSettle(){
  const { thu, luong } = unsettledItems();
  const all = [...thu, ...luong];
  if(!all.length){ showToast('Không có giao dịch nào cần quyết toán'); return; }
  const { from, to } = settleRange(all);
  document.getElementById('settleTitle').textContent = `Quyết toán Kỳ ${settlements.length + 1}`;
  const lines = [
    ['Từ ngày', fmtDateShort(from)],
    ['Đến ngày', fmtDateShort(to)],
    ['Số giao dịch', `${all.length}`],
    [`Số dư ${BOOKS.thu.title}`, fmtVND(balanceOf(thu))],
    [`Số dư ${BOOKS.luong.title}`, fmtVND(balanceOf(luong))],
    ['Tổng quyết toán', fmtVND(balanceOf(all))],
  ];
  document.getElementById('settleSummary').innerHTML = lines
    .map(([k, v]) => `<div class="line"><span>${k}</span><span class="num">${v}</span></div>`).join('');
  document.getElementById('settleBackdrop').classList.add('open');
  document.getElementById('settleSheet').classList.add('open');
}
function closeSettle(){
  document.getElementById('settleBackdrop').classList.remove('open');
  document.getElementById('settleSheet').classList.remove('open');
}

function writeBooks(thu, luong){
  try{
    localStorage.setItem(BOOKS.thu.key, JSON.stringify(thu));
    localStorage.setItem(BOOKS.luong.key, JSON.stringify(luong));
    return true;
  }catch(e){ return false; }
}

function handleSettle(){
  closeSettle();
  const { thu, luong } = unsettledItems();
  const all = [...thu, ...luong];
  if(!all.length) return;
  const { from, to } = settleRange(all);
  const settlement = { id: 'st_' + Date.now(), date: todayISO(), from, to };
  const ids = new Set(all.map(i => i.id));
  const stamp = list => list.map(i => ids.has(i.id) ? { ...i, settlement: settlement.id } : i);
  const oldThu = readBook('thu'), oldLuong = readBook('luong');
  settlements.push(settlement);
  if(!saveSettlements() || !writeBooks(stamp(oldThu), stamp(oldLuong))){
    settlements.pop();
    saveSettlements();
    writeBooks(oldThu, oldLuong);
    showToast('Không lưu được, thử lại nhé');
    return;
  }
  setViewPeriod(settlements.length);
  showToast(`Đã quyết toán Kỳ ${settlements.length}, bắt đầu kỳ mới`);
}

async function handleUnsettle(){
  const last = settlements[settlements.length - 1];
  if(!last) return;
  const ok = await showConfirm(`Hủy quyết toán Kỳ ${settlements.length} (${fmtDateShort(last.from)} – ${fmtDateShort(last.to)})? Giao dịch của kỳ đó sẽ gộp lại với kỳ hiện tại.`);
  if(!ok) return;
  const unstamp = list => list.map(i => {
    if(i.settlement !== last.id) return i;
    const { settlement, ...rest } = i;
    return rest;
  });
  if(!writeBooks(unstamp(readBook('thu')), unstamp(readBook('luong')))){
    showToast('Không lưu được, thử lại nhé');
    return;
  }
  settlements.pop();
  saveSettlements();
  setViewPeriod(settlements.length);
  showToast('Đã hủy lần quyết toán gần nhất');
}

function switchBook(book){
  if(book === currentBook || !(book in BOOKS || book === SUMMARY)) return;
  currentBook = book;
  localStorage.setItem(ACTIVE_BOOK_KEY, book);
  resetFilters();
  document.querySelectorAll('#bookTabs .book-tab').forEach(b => b.classList.toggle('active', b.dataset.book === book));
  document.body.classList.toggle('book-luong', book === 'luong');
  document.body.classList.toggle('book-tong', book === SUMMARY);
  syncThemeColor();
  loadItems();
}

// Giao diện: 'auto' (theo máy) | 'light' | 'dark', lưu trên máy này
const THEME_KEY = 'so-thu-tien-theme';
const darkQuery = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function themePref(){
  try{ return localStorage.getItem(THEME_KEY) || 'auto'; }catch(e){ return 'auto'; }
}
function applyTheme(){
  const pref = themePref();
  const dark = pref === 'dark' || (pref === 'auto' && !!darkQuery && darkQuery.matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.querySelectorAll('#themeSeg .book-tab').forEach(b => b.classList.toggle('active', b.dataset.themeOpt === pref));
  syncThemeColor();
}
function setTheme(pref){
  try{ localStorage.setItem(THEME_KEY, pref); }catch(e){}
  applyTheme();
}
// Màu thanh trạng thái (Android) theo màu nền của sổ đang mở; đọc biến CSS vì nền có hiệu ứng chuyển màu
function syncThemeColor(){
  const paper = getComputedStyle(document.body).getPropertyValue('--paper').trim();
  if(paper) document.querySelector('meta[name="theme-color"]').setAttribute('content', paper);
}

async function loadItems(){
  items = storage.get();
  render();
}
async function saveItems(){
  const ok = storage.set(items);
  if(!ok) showToast('Không lưu được, thử lại nhé');
}

// Ô số tiền: tự thêm dấu chấm hàng nghìn khi gõ (1250000 -> 1.250.000)
function setAmountInput(n){
  document.getElementById('fAmount').value = n ? new Intl.NumberFormat('vi-VN').format(n) : '';
}
function readAmountInput(){
  return parseInt(document.getElementById('fAmount').value.replace(/\D/g, ''), 10) || 0;
}
function formatAmountInput(){
  const el = document.getElementById('fAmount');
  const caret = el.selectionStart ?? el.value.length;
  // Giữ con trỏ đứng sau đúng chữ số đang gõ, dù dấu chấm được thêm/bớt phía trước
  const digitsBefore = el.value.slice(0, caret).replace(/\D/g, '').length;
  const digits = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 15);
  setAmountInput(Number(digits));
  if(digits === '0') el.value = '0';
  let pos = 0, seen = 0;
  while(pos < el.value.length && seen < digitsBefore){
    if(/\d/.test(el.value[pos])) seen++;
    pos++;
  }
  if(document.activeElement === el) el.setSelectionRange(pos, pos);
}

function openSheet(edit, type = 'in'){
  editingId = null;
  document.getElementById('fName').value = '';
  setAmountInput(0);
  document.getElementById('fDate').value = todayISO();
  document.getElementById('fNote').value = '';

  if(edit){
    editingId = edit.id;
    type = edit.type;
    document.getElementById('fName').value = edit.name;
    setAmountInput(edit.amount);
    document.getElementById('fDate').value = edit.date;
    document.getElementById('fNote').value = edit.note || '';
  }
  // Xóa nằm trong form sửa thay vì nút ✕ ở từng dòng, tránh bấm nhầm
  document.getElementById('deleteBtn').style.display = edit ? '' : 'none';
  setFormType(type);
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  setTimeout(() => document.getElementById('fName').focus(), 200);
}
function closeSheet(){
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

async function handleSave(){
  const cfg = formType === 'out' ? OUT_CFG : BOOKS[currentBook];
  const type = formType;
  const name = document.getElementById('fName').value.trim();
  const amount = readAmountInput();
  const date = document.getElementById('fDate').value || todayISO();
  const note = document.getElementById('fNote').value.trim();

  if(!name){ showToast(`Nhập ${cfg.nameLabel.toLowerCase()}`); return; }
  if(!amount || amount <= 0){ showToast('Nhập số tiền hợp lệ'); return; }
  if(type === 'out'){
    const editing = items.find(i => i.id === editingId);
    const balance = bookBalance(editingId, editing ? periodOf(editing) : settlements.length);
    if(amount > balance){
      const ok = await showConfirm(`Số rút (${fmtVND(amount)}) lớn hơn số dư hiện tại (${fmtVND(balance)}). Vẫn lưu?`);
      if(!ok) return;
    }
  }

  if(editingId){
    const idx = items.findIndex(i => i.id === editingId);
    if(idx > -1){
      items[idx] = { ...items[idx], name, amount, date, note, type };
    }
  } else {
    items.push({
      id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      name, amount, date, note, type
    });
  }
  await saveItems();
  closeSheet();
  render();
  showToast('Đã lưu');
}

async function handleDelete(id){
  const item = items.find(i => i.id === id);
  if(!item) return;
  const ok = await showConfirm(`Xóa "${item.name}" (${fmtVND(item.amount)})? Không thể hoàn tác.`, 'Xóa');
  if(!ok) return;
  items = items.filter(i => i.id !== id);
  await saveItems();
  closeSheet();
  render();
  showToast('Đã xóa');
}

const ICON_OUT = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>';
const ICON_EMPTY = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>';
const ICON_CAL = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';

function renderFilters(months){
  document.querySelectorAll('#typeFilter .book-tab').forEach(b => b.classList.toggle('active', b.dataset.type === typeFilter));
  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = '';
  const addChip = (label, active, onclick) => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (active ? ' active' : '');
    chip.innerHTML = label;
    chip.onclick = onclick;
    filterRow.appendChild(chip);
  };
  const pickMonth = mk => () => { activeFilter = mk; document.getElementById('rangeBar').classList.remove('open'); render(); };
  addChip('Mọi tháng', activeFilter === 'all', pickMonth('all'));
  // Đặt trước các tháng để không bị khuất khi có nhiều tháng
  const rangeText = activeFilter === 'range' && dateRange
    ? `${fmtDateShort(dateRange.from).slice(0,5)} – ${fmtDateShort(dateRange.to).slice(0,5)}`
    : 'Khoảng ngày';
  addChip(`${ICON_CAL}<span>${rangeText}</span>`, activeFilter === 'range',
    () => document.getElementById('rangeBar').classList.toggle('open'));
  months.forEach(mk => addChip(monthLabel(mk), activeFilter === mk, pickMonth(mk)));
}

function renderRow(item){
  const row = document.createElement('div');
  const out = isOut(item);
  row.className = 'row' + (out ? ' out' : '');
  const meta = [];
  if(item._book) meta.push(`Sổ ${BOOKS[item._book].title}`);
  if(item.note) meta.push(escapeHtml(item.note));
  if(!meta.length) meta.push(out ? 'Rút tiền' : 'Tiền vào');
  row.innerHTML = `
    <div class="avatar">${out ? ICON_OUT : escapeHtml(initials(item.name))}</div>
    <div class="info">
      <div class="name">${escapeHtml(item.name)}</div>
      <div class="meta">${meta.join(' · ')}</div>
    </div>
    <div class="amt num">${moneyHTML(item.amount, out ? '−' : '+')}</div>
  `;
  // Ở tab Tổng, bấm vào dòng sẽ chuyển sang đúng sổ và mở form sửa
  row.addEventListener('click', isSummary() ? () => openInBook(item._book, item.id) : () => openSheet(item));
  return row;
}

function render(){
  const shown = periodItems();
  const months = Array.from(new Set(shown.map(i => monthKey(i.date))))
    .sort((a,b) => b.localeCompare(a));
  renderFilters(months);

  let filtered;
  if(activeFilter === 'range' && dateRange){
    filtered = shown.filter(i => i.date && i.date >= dateRange.from && i.date <= dateRange.to);
  } else {
    filtered = activeFilter === 'all' ? shown : shown.filter(i => monthKey(i.date) === activeFilter);
  }
  const tin = sumAmount(filtered.filter(i => !isOut(i)));
  const tout = sumAmount(filtered.filter(isOut));
  if(typeFilter !== 'all') filtered = filtered.filter(i => isOut(i) === (typeFilter === 'out'));
  filtered = filtered.slice()
    .sort((a,b) => (b.date || '').localeCompare(a.date || '') || b.id.localeCompare(a.id));

  const total = typeFilter === 'in' ? tin : typeFilter === 'out' ? tout : tin - tout;
  const amountEl = document.getElementById('totalAmount');
  amountEl.innerHTML = moneyHTML(total);
  amountEl.classList.toggle('neg', total < 0);
  document.getElementById('inLabel').innerHTML = moneyHTML(tin);
  document.getElementById('outLabel').innerHTML = moneyHTML(tout);
  const breakdown = document.getElementById('breakdown');
  if(isSummary()){
    const fromBook = b => sumAmount(filtered.filter(i => i._book === b && !isOut(i)));
    breakdown.textContent = `Thu gồm: Sổ ${BOOKS.thu.title} ${fmtVND(fromBook('thu'))} · Sổ ${BOOKS.luong.title} ${fmtVND(fromBook('luong'))}`;
    breakdown.style.display = '';
  } else {
    breakdown.style.display = 'none';
  }
  document.getElementById('countLabel').textContent = `${filtered.length} giao dịch`;
  let totalLabelText = typeFilter === 'in' ? 'Tổng thu' : typeFilter === 'out' ? 'Tổng rút' : viewCfg().totalLabel;
  if(activeFilter === 'range' && dateRange){
    totalLabelText += ` ${fmtDateShort(dateRange.from)} – ${fmtDateShort(dateRange.to)}`;
  } else if(activeFilter !== 'all'){
    totalLabelText += ` ${monthLabel(activeFilter)}`;
  }
  document.getElementById('totalLabel').textContent = totalLabelText;

  const list = document.getElementById('list');
  list.innerHTML = '';
  if(filtered.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `<div class="empty-icon">${ICON_EMPTY}</div>`;
    empty.append(settlements.length && !shown.length ? 'Chưa có giao dịch nào trong kỳ này.' : viewCfg().emptyText);
    list.appendChild(empty);
    return;
  }
  // Nhóm theo ngày (danh sách đã sắp xếp mới nhất trước), kèm tổng thu - rút của ngày
  let card = null, lastDate = null;
  filtered.forEach(item => {
    if(!card || item.date !== lastDate){
      lastDate = item.date;
      const dayItems = filtered.filter(i => i.date === lastDate);
      const net = sumAmount(dayItems.filter(i => !isOut(i))) - sumAmount(dayItems.filter(isOut));
      const head = document.createElement('div');
      head.className = 'group-head';
      head.innerHTML = `<span>${dayLabel(lastDate)}</span><span class="num">${moneyHTML(Math.abs(net), net < 0 ? '−' : '+')}</span>`;
      card = document.createElement('div');
      card.className = 'group-card';
      list.append(head, card);
    }
    card.appendChild(renderRow(item));
  });
}

function openInBook(book, id){
  switchBook(book);
  const item = items.find(i => i.id === id);
  if(item) openSheet(item);
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Đang lọc "Rút" thì mở form ở chế độ rút luôn
document.getElementById('addBtn').addEventListener('click', () => openSheet(null, typeFilter === 'out' ? 'out' : 'in'));
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
document.getElementById('backdrop').addEventListener('click', closeSheet);
document.getElementById('saveBtn').addEventListener('click', handleSave);
document.getElementById('deleteBtn').addEventListener('click', () => { if(editingId) handleDelete(editingId); });
document.getElementById('fAmount').addEventListener('input', formatAmountInput);
// Xóa ngay cạnh dấu chấm thì bỏ qua dấu chấm để xóa chữ số, nếu không dấu chấm sẽ bị thêm lại ngay
document.getElementById('fAmount').addEventListener('beforeinput', (e) => {
  const el = e.target;
  if(el.selectionStart !== el.selectionEnd) return;
  const pos = el.selectionStart;
  if(e.inputType === 'deleteContentBackward' && el.value[pos - 1] === '.') el.setSelectionRange(pos - 1, pos - 1);
  if(e.inputType === 'deleteContentForward' && el.value[pos] === '.') el.setSelectionRange(pos + 1, pos + 1);
});
document.querySelectorAll('#typeFilter .book-tab').forEach(btn => {
  btn.addEventListener('click', () => { typeFilter = btn.dataset.type; render(); });
});
document.getElementById('scanBtn').addEventListener('click', () => document.getElementById('scanInput').click());
document.getElementById('scanInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  handleScanImage(file);
  e.target.value = '';
});
document.querySelectorAll('#bookTabs .book-tab').forEach(btn => {
  btn.addEventListener('click', () => switchBook(btn.dataset.book));
});
document.querySelectorAll('#typeTabs .book-tab').forEach(btn => {
  btn.addEventListener('click', () => setFormType(btn.dataset.type));
});
document.getElementById('rangeApply').addEventListener('click', () => {
  const from = document.getElementById('rangeFrom').value;
  const to = document.getElementById('rangeTo').value;
  if(!from || !to){ showToast('Chọn đủ ngày bắt đầu và kết thúc'); return; }
  if(from > to){ showToast('Ngày bắt đầu phải trước ngày kết thúc'); return; }
  dateRange = { from, to };
  activeFilter = 'range';
  render();
  document.getElementById('rangeBar').classList.add('open');
});

  document.getElementById('rangeFrom').value = '';
  document.getElementById('rangeTo').value = '';
  activeFilter = 'all';
  document.getElementById('rangeBar').classList.remove('open');
  render();
});
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsCloseBtn').addEventListener('click', closeSettings);
document.getElementById('settingsBackdrop').addEventListener('click', closeSettings);
document.getElementById('exportBtn').addEventListener('click', () => { handleExport(); closeSettings(); });
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importInput').click());

});
document.getElementById('periodBtn').addEventListener('click', openPeriodSheet);
document.getElementById('periodCloseBtn').addEventListener('click', closePeriodSheet);
document.getElementById('periodBackdrop').addEventListener('click', closePeriodSheet);
document.getElementById('pastBannerBtn').addEventListener('click', () => setViewPeriod(settlements.length));
document.getElementById('settleBtn').addEventListener('click', () => { closeSettings(); openSettle(); });
document.getElementById('unsettleBtn').addEventListener('click', () => { closeSettings(); handleUnsettle(); });
document.getElementById('settleCancelBtn').addEventListener('click', closeSettle);
document.getElementById('settleBackdrop').addEventListener('click', closeSettle);
document.getElementById('settleOkBtn').addEventListener('click', handleSettle);
document.getElementById('confirmCancelBtn').addEventListener('click', () => closeConfirm(false));
document.getElementById('confirmOkBtn').addEventListener('click', () => closeConfirm(true));
document.getElementById('confirmBackdrop').addEventListener('click', () => closeConfirm(false));

document.querySelectorAll('#bookTabs .book-tab').forEach(b => b.classList.toggle('active', b.dataset.book === currentBook));
document.body.classList.toggle('book-luong', currentBook === 'luong');
document.body.classList.toggle('book-tong', currentBook === SUMMARY);
document.querySelectorAll('#themeSeg .book-tab').forEach(btn => {
  btn.addEventListener('click', () => setTheme(btn.dataset.themeOpt));
});
if(darkQuery){
  const onSystemChange = () => { if(themePref() === 'auto') applyTheme(); };
  darkQuery.addEventListener ? darkQuery.addEventListener('change', onSystemChange) : darkQuery.addListener(onSystemChange);
}
applyTheme();
setFormType('in');
setViewPeriod(settlements.length);

if('serviceWorker' in navigator){
  // Khi service worker mới tiếp quản thì tải lại 1 lần để hiện ngay code mới
  // (chỉ khi đã có SW cũ, lần cài đầu tiên không cần reload)
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadController || reloaded) return;
    reloaded = true;
    location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
  });
}
