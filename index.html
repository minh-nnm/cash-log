<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sổ thu tiền</title>
<style>
  :root{
    --paper:#F7F5EF;
    --ink:#12321F;
    --accent:#2F9E6E;
    --accent-dim:#DCEFE3;
    --warn:#C05B2E;
    --muted:#8A9A8E;
    --line:#D8D2C4;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-variant-numeric: tabular-nums;}

  header{
    padding:28px 20px 20px;
    position:relative;
  }
  header::after{
    content:"";
    position:absolute;
    left:20px; right:20px; bottom:0;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 4px;
  }
  h1{
    margin:0;
    font-size:22px;
    font-weight:700;
  }

  .total-card{
    margin:20px 20px 0;
    background:var(--ink);
    color:var(--paper);
    border-radius:18px;
    padding:22px 20px;
    position:relative;
    overflow:hidden;
  }
  .total-card .label{
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    opacity:.65;
    margin-bottom:6px;
  }
  .total-card .amount{
    font-size:34px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .total-card .sub{
    margin-top:10px;
    font-size:13px;
    opacity:.7;
    display:flex;
    justify-content:space-between;
  }

  .filter-row{
    display:flex;
    gap:8px;
    margin:16px 20px 0;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .chip{
    flex:none;
    font-size:13px;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
    cursor:pointer;
  }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--white);
    font-weight:600;
  }

  .list{
    margin:18px 20px 0;
    background:var(--white);
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .empty{
    padding:36px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px dashed var(--line);
    position:relative;
  }
  .row:last-child{border-bottom:none;}
  .row .dot{
    width:36px; height:36px; border-radius:50%;
    background:var(--accent-dim);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px;
    flex:none;
  }
  .row .info{flex:1; min-width:0;}
  .row .name{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .meta{font-size:12.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .amt{font-weight:700; font-size:15px; flex:none; text-align:right;}
  .row .del{
    flex:none;
    width:28px; height:28px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .row .del:active{background:#F0E9E4; color:var(--warn);}

  .fab{
    position:fixed;
    right:20px; bottom:20px;
    width:58px; height:58px;
    border-radius:50%;
    background:var(--accent);
    color:var(--white);
    border:none;
    font-size:28px;
    box-shadow:0 8px 20px rgba(47,158,110,.35);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:20;
  }
  .fab:active{transform:scale(.94);}

  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(18,50,31,.4);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:30;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--paper);
    border-radius:20px 20px 0 0;
    padding:20px 20px 28px;
    transform:translateY(100%);
    transition:transform .25s ease;
    z-index:31;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet.open{transform:translateY(0);}
  .sheet h2{margin:0 0 16px; font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--white);
    font-size:16px;
    color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:12px;
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:var(--white);}
  .btn-primary:active{background:#26825c;}
  .btn-ghost{background:var(--white); color:var(--ink); border:1px solid var(--line);}

  .toast{
    position:fixed;
    left:50%; bottom:90px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
    z-index:40;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <p class="eyebrow">Cá nhân · lưu trên máy này</p>
  <h1>Sổ thu tiền</h1>
</header>

<div class="total-card">
  <div class="label" id="totalLabel">Tổng đã nhận</div>
  <div class="amount mono" id="totalAmount">0 ₫</div>
  <div class="sub">
    <span id="countLabel">0 giao dịch</span>
    <span id="rangeLabel"></span>
  </div>
</div>

<div class="filter-row" id="filterRow"></div>

<div class="list" id="list"></div>

<button class="fab" id="addBtn" aria-label="Thêm giao dịch">+</button>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <h2 id="sheetTitle">Thêm giao dịch</h2>
  <div class="field">
    <label for="fName">Người chuyển</label>
    <input type="text" id="fName" placeholder="VD: Nguyễn Văn A" autocomplete="off">
  </div>
  <div class="field">
    <label for="fAmount">Số tiền (VND)</label>
    <input type="number" id="fAmount" placeholder="VD: 500000" inputmode="numeric">
  </div>
  <div class="field">
    <label for="fDate">Ngày giao dịch</label>
    <input type="date" id="fDate">
  </div>
  <div class="field">
    <label for="fNote">Ghi chú (không bắt buộc)</label>
    <input type="text" id="fNote" placeholder="VD: tiền hàng, nội dung CK..." autocomplete="off">
  </div>
  <div class="sheet-actions">
    <button class="btn btn-ghost" id="cancelBtn">Hủy</button>
    <button class="btn btn-primary" id="saveBtn">Lưu</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'so-thu-tien-transactions';
let items = [];
let editingId = null;
let activeFilter = 'all';

// Lưu trực tiếp trên trình duyệt của máy (localStorage) để dùng độc lập,
// không cần mở qua Claude mỗi lần.
const storage = {
  get(){
    try{
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  },
  set(data){
    try{
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    }catch(e){ return false; }
  }
};

function fmtVND(n){
  return new Intl.NumberFormat('vi-VN').format(n) + ' \u20AB';
}
function initials(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '?';
  return (parts[parts.length-1][0] || '?').toUpperCase();
}
function fmtDateShort(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function monthKey(iso){
  if(!iso) return 'khac';
  return iso.slice(0,7); // YYYY-MM
}
function monthLabel(key){
  if(key === 'khac') return 'Khác';
  const [y,m] = key.split('-');
  return `Th ${parseInt(m,10)}/${y}`;
}
function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

async function loadItems(){
  items = storage.get();
  render();
}
async function saveItems(){
  const ok = storage.set(items);
  if(!ok) showToast('Không lưu được, thử lại nhé');
}

function openSheet(edit){
  editingId = null;
  document.getElementById('sheetTitle').textContent = 'Thêm giao dịch';
  document.getElementById('fName').value = '';
  document.getElementById('fAmount').value = '';
  document.getElementById('fDate').value = todayISO();
  document.getElementById('fNote').value = '';

  if(edit){
    editingId = edit.id;
    document.getElementById('sheetTitle').textContent = 'Sửa giao dịch';
    document.getElementById('fName').value = edit.name;
    document.getElementById('fAmount').value = edit.amount;
    document.getElementById('fDate').value = edit.date;
    document.getElementById('fNote').value = edit.note || '';
  }
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  setTimeout(() => document.getElementById('fName').focus(), 200);
}
function closeSheet(){
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

async function handleSave(){
  const name = document.getElementById('fName').value.trim();
  const amount = parseFloat(document.getElementById('fAmount').value);
  const date = document.getElementById('fDate').value || todayISO();
  const note = document.getElementById('fNote').value.trim();

  if(!name){ showToast('Nhập tên người chuyển'); return; }
  if(!amount || amount <= 0){ showToast('Nhập số tiền hợp lệ'); return; }

  if(editingId){
    const idx = items.findIndex(i => i.id === editingId);
    if(idx > -1){
      items[idx] = { ...items[idx], name, amount, date, note };
    }
  } else {
    items.push({
      id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      name, amount, date, note
    });
  }
  await saveItems();
  closeSheet();
  render();
  showToast('Đã lưu');
}

async function handleDelete(id){
  items = items.filter(i => i.id !== id);
  await saveItems();
  render();
  showToast('Đã xóa');
}

function render(){
  // filters (by month)
  const months = Array.from(new Set(items.map(i => monthKey(i.date))))
    .sort((a,b) => b.localeCompare(a));
  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (activeFilter === 'all' ? ' active' : '');
  allChip.textContent = 'Tất cả';
  allChip.onclick = () => { activeFilter = 'all'; render(); };
  filterRow.appendChild(allChip);
  months.forEach(mk => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeFilter === mk ? ' active' : '');
    chip.textContent = monthLabel(mk);
    chip.onclick = () => { activeFilter = mk; render(); };
    filterRow.appendChild(chip);
  });

  const filtered = (activeFilter === 'all' ? items : items.filter(i => monthKey(i.date) === activeFilter))
    .slice()
    .sort((a,b) => (b.date || '').localeCompare(a.date || '') || b.id.localeCompare(a.id));

  const total = filtered.reduce((s,i) => s + (i.amount || 0), 0);
  document.getElementById('totalAmount').textContent = fmtVND(total);
  document.getElementById('countLabel').textContent = `${filtered.length} giao dịch`;
  document.getElementById('totalLabel').textContent = activeFilter === 'all' ? 'Tổng đã nhận' : `Tổng ${monthLabel(activeFilter)}`;

  const list = document.getElementById('list');
  list.innerHTML = '';
  if(filtered.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Chưa có giao dịch nào. Bấm nút + để thêm.';
    list.appendChild(empty);
    return;
  }
  filtered.forEach(item => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="dot">${initials(item.name)}</div>
      <div class="info">
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="meta">${fmtDateShort(item.date)}${item.note ? ' · ' + escapeHtml(item.note) : ''}</div>
      </div>
      <div class="amt mono">${fmtVND(item.amount)}</div>
      <button class="del" aria-label="Xóa">✕</button>
    `;
    row.querySelector('.info').addEventListener('click', () => openSheet(item));
    row.querySelector('.dot').addEventListener('click', () => openSheet(item));
    row.querySelector('.amt').addEventListener('click', () => openSheet(item));
    row.querySelector('.del').addEventListener('click', (e) => {
      e.stopPropagation();
      handleDelete(item.id);
    });
    list.appendChild(row);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('addBtn').addEventListener('click', () => openSheet(null));
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
document.getElementById('backdrop').addEventListener('click', closeSheet);
document.getElementById('saveBtn').addEventListener('click', handleSave);

loadItems();
</script>
</body>
</html>
